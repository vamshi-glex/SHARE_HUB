<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage {{ page.name }} - CloneCat</title>
</head>

<body>

    <main>

        <h1>CloneCat Manager</h1>

        <h2>{{ page.name }}</h2>

        {% if page.edit_locked %}

            <p>🔒 Page is currently locked.</p>

            <button onclick="toggleLock(false)">
                🔓 Unlock Editing
            </button>

        {% else %}

            <p>🔓 Page is currently unlocked.</p>

            <button onclick="toggleLock(true)">
                🔒 Lock Editing
            </button>

        {% endif %}

        <p id="status"></p>

    </main>


    <script>

        async function toggleLock(lock) {

            const status =
                document.getElementById("status");

            status.textContent = "Updating...";

            try {

                const response = await fetch(
                    "/api/pages/{{ page.name }}/lock",
                    {
                        method: "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "same-origin",

                        body: JSON.stringify({
                            edit_locked: lock
                        })
                    }
                );


                const contentType =
                    response.headers.get(
                        "content-type"
                    );


                if (!contentType ||
                    !contentType.includes("application/json")) {

                    const text =
                        await response.text();

                    console.error(
                        "Server response:",
                        text
                    );

                    status.textContent =
                        "Server returned an unexpected response.";

                    return;
                }


                const data =
                    await response.json();


                if (!response.ok) {

                    status.textContent =
                        data.error || "Request failed.";

                    return;
                }


                status.textContent =
                    "Updated successfully!";


                setTimeout(() => {

                    window.location.reload();

                }, 500);


            } catch (error) {

                console.error(
                    "Lock error:",
                    error
                );

                status.textContent =
                    "Something went wrong.";

            }

        }

    </script>

</body>

</html>
