<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ page.name }} — CloneCat</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    {% if is_owner %}

    <p>
        👑 You are the owner of this page.
    </p>

{% endif %}

    <main class="container">

        <h1>CloneCat</h1>

        <h2>{{ page.name }}</h2>

        {% if page.edit_locked %}
            <p class="lock-status">
                🔒 This page is read-only
            </p>
        {% else %}
            <p class="lock-status">
                ✏️ Anyone can edit this page
            </p>
        {% endif %}

        <div class="editor">

            <textarea
                id="pageText"
                placeholder="Write something..."
                {% if page.edit_locked %}readonly{% endif %}
            >{{ page.text }}</textarea>

            {% if not page.edit_locked %}

                <button
                    id="saveButton"
                    onclick="saveText()"
                >
                    Save
                </button>

            {% endif %}

            <p id="status"></p>

        </div>

        <div class="controls">

            {% if page.edit_locked %}
        
                <button
                    id="lockButton"
                    onclick="toggleEditLock(false)"
                >
                    🔓 Unlock Editing
                </button>
        
            {% else %}
        
                <button
                    id="lockButton"
                    onclick="toggleEditLock(true)"
                >
                    🔒 Lock Editing
                </button>
        
            {% endif %}
        
        </div>

    </main>

    <script>

        async function saveText() {

            const text =
                document.getElementById("pageText").value;

            const status =
                document.getElementById("status");

            const button =
                document.getElementById("saveButton");

            button.disabled = true;

            status.textContent = "Saving...";

            try {

                const response = await fetch(
                    "/api/pages/{{ page.name }}",
                    {
                        method: "PATCH",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            text: text
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    status.textContent = data.error;
                    return;
                }

                status.textContent =
                    "Saved successfully!";

            } catch (error) {

                status.textContent =
                    "Something went wrong.";

                console.error(error);

            } finally {

                button.disabled = false;
            }
        }

        async function toggleEditLock(lock) {

const status =
    document.getElementById("status");

const button =
    document.getElementById("lockButton");

button.disabled = true;

status.textContent = "Updating...";

try {

    const response = await fetch(
        "/api/pages/{{ page.name }}/lock",
        {
            method: "PATCH",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                edit_locked: lock
            })
        }
    );

    const data = await response.json();

    if (!response.ok) {
        status.textContent = data.error;
        return;
    }

    status.textContent =
        "Lock status updated.";

    setTimeout(() => {
        window.location.reload();
    }, 500);

} catch (error) {

    status.textContent =
        "Something went wrong.";

    console.error(error);

} finally {

    button.disabled = false;
}
}

    </script>

</body>

</html>
