<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ page.name }} — CloneCat</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <main class="container">

        <h1>CloneCat</h1>

        <h2>{{ page.name }}</h2>

        <div class="editor">

            <textarea
                id="pageText"
                placeholder="Write something..."
            >{{ page.text }}</textarea>

            <button id="saveButton" onclick="saveText()">
                Save
            </button>

            <p id="status"></p>

        </div>

    </main>

    <script>
        async function saveText() {

            const text =
                document.getElementById("pageText").value;

            const status =
                document.getElementById("status");

            const button =
                document.getElementById("saveButton");

            button.disabled = true;
            status.textContent = "Saving...";

            try {

                const response = await fetch(
                    "/api/pages/{{ page.name }}",
                    {
                        method: "PATCH",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            text: text
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    status.textContent = data.error;
                    return;
                }

                status.textContent =
                    "Saved successfully!";

            } catch (error) {

                status.textContent =
                    "Something went wrong.";

                console.error(error);

            } finally {

                button.disabled = false;
            }
        }
    </script>

</body>

</html>
