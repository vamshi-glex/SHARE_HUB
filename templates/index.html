<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloneCat</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
    <link
    rel="icon"
    type="image/png"
    sizes="96x96"
    href="{{ url_for('static', filename='images/favicon-96x96.png') }}"
>
    
     
     
    
     
</head>

<body>

    <main class="landing">

        <!-- Navigation -->
        <nav class="navbar">

            <a href="/" class="brand">
                <img
    src="{{ url_for('static', filename='images/clonecat_logo.png') }}"
    alt="CloneCat"
    class="brand-logo-icon"
>
            
                <span class="brand-name">
                    <span class="brand-clone">Clone</span><span class="brand-cat">Cat</span>
                </span>
            </a>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/about">About</a>
                <a href="/features">Features</a>
            </div>

        </nav>


        <!-- Hero -->
        <section class="hero">

            <div class="hero-badge">
                SIMPLE · FAST · NO ACCOUNT
            </div>

            <h1>
                Share text.<br>
                <span>No account.</span>
            </h1>

            <p class="hero-description">
                Create a page, write anything you want,
                and share the link with anyone.
            </p>


            <!-- Create / Open Page -->
            <div class="create-card">

                <label for="pageName">
                    Create or open a page
                </label>

                <div class="page-input-group">

                    <span class="url-prefix">/</span>

                    <input
                        type="text"
                        id="pageName"
                        placeholder="page-name"
                        autocomplete="off"
                        maxlength="50"
                        onkeydown="if(event.key === 'Enter') openPage()"
                    >

                    <button
                        onclick="openPage()"
                        class="primary-button"
                    >
                        Create
                        <span>→</span>
                    </button>

                </div>

                <p class="input-hint">
                    Use letters, numbers, hyphens or underscores.
                </p>

                <p class="expiry-info">
                    <span class="expiry-icon">⏱</span>
                    Available for 2 days
                </p>

            </div>

        </section>


        <!-- Footer -->
        <footer class="landing-footer">
            CloneCat · Share text without the hassle.
        </footer>

    </main>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
